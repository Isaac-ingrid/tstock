<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 背景渐变：深邃科技蓝黑 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- T字横梁渐变：代表做T做差价的动能（青蓝至高亮青绿） -->
    <linearGradient id="tBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- K线多头渐变：红绿双色或亮红冲高 -->
    <linearGradient id="candleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- 质感光晕滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 外圆角容器卡片 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25"/>

  <!-- 背景微网格（象征七格箱体波动模型） -->
  <path d="M 28 44 L 100 44" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.6"/>
  <path d="M 28 64 L 100 64" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.6"/>
  <path d="M 28 84 L 100 84" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.6"/>

  <!-- 左侧与右侧辅助日内高抛低吸K线 -->
  <!-- 左侧低吸K线 (绿) -->
  <line x1="36" y1="52" x2="36" y2="82" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="32" y="60" width="8" height="15" rx="2" fill="#10b981"/>

  <!-- 右侧高抛冲高K线 (红) -->
  <line x1="92" y1="42" x2="92" y2="76" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <rect x="88" y="48" width="8" height="18" rx="2" fill="#f43f5e"/>

  <!-- 核心中央字母 "T" 结构 -->
  <!-- T字竖杆：高科技微发光立柱 -->
  <rect x="58" y="38" width="12" height="62" rx="6" fill="url(#stemGrad)" filter="url(#glow)"/>
  
  <!-- T字顶部横梁：微倾斜+平滑圆角，带有势头感 -->
  <rect x="22" y="26" width="84" height="14" rx="7" fill="url(#tBarGrad)" filter="url(#glow)"/>

  <!-- 横梁左端低吸点脉冲锚点（买入） -->
  <circle cx="29" cy="33" r="3.5" fill="#ffffff"/>

  <!-- 横梁右端高抛盈利点脉冲（卖出/破位冲高） -->
  <circle cx="99" cy="33" r="4.5" fill="#fef08a"/>
  <polygon points="99,23 102,30 109,33 102,36 99,43 96,36 89,33 96,30" fill="#fef08a" opacity="0.85"/>
</svg>
