# ============================================================
# 服务器 nginx 站点配置 —— 应用到 tstock 站点 (/etc/nginx/sites-available/default)
#
# 注意：
#   1. 同机 443 端口运行有 otto 服务，80 端口必须保持 `server_name _;`
#      切勿在 80 端口绑定裸 IP，以免影响 443 流量路由。
#   2. /data/ 使用 `^~` 前缀优先匹配，防止 latest.js 被正则 \.js$ 缓存 1 小时。
#   3. /sw.js 与 /manifest.json 走 no-cache，保证手机 PWA 主屏幕及时更新。
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /root/tstock/dist;
    index index.html index.htm;

    server_name _;
    charset utf-8;
    autoindex off;

    # ---------- 1. 放行同机 Otto 短期 IP 证书续期校验，其余隐藏文件一律禁止 ----------
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------- 2. 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 3. 独立股票数据与金库后端 ----------
    # FastAPI 监听 127.0.0.1:8000；90s 超时兼容起爆扫描、尾盘扫描与复盘教练
    location ^~ /stock-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # ---------- 4. 数据契约与 PWA 清单：每次校验，不缓存 ----------
    location ^~ /data/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------- 5. Next.js 哈希构建资产与静态资源缓存 ----------
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
