# ============================================================
# 服务器 nginx 站点配置 —— 应用到 tstock 站点
#
# 为什么需要这份文件：
#   1. 实测 http://115.29.164.8/.git/config 可被任意人下载，
#      GitHub 仓库地址泄露。这是必须修的。
#   2. data/latest.js 有 584KB，没开 gzip 传原文件，手机端打开慢。
#   3. 没有 Cache-Control，浏览器可能长时间不刷新，导致
#      「明明更新了但看到的还是昨天的选股」。
#
# 应用方式（服务器上，root）：
#   cp 这份文件到 /etc/nginx/sites-available/tstock
#   改下面 root 一行成实际站点目录
#   ln -sf /etc/nginx/sites-available/tstock /etc/nginx/sites-enabled/tstock
#   nginx -t && systemctl reload nginx
#
# 注意：如果原站点已有一份配置（比如 default），别直接覆盖，
#       把下面这几个 location / gzip 段合并进去即可。
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 改成实际站点目录，用 `nginx -T | grep -A2 "server_name"` 可查
    root /var/www/tstock;
    index index.html;

    server_name _;

    charset utf-8;

    # ---------- 1. 禁止访问隐藏文件（.git / .env / .htaccess） ----------
    # 实测 .git/config 当前可被下载，直接暴露 GitHub 仓库地址。
    # 这一条必须在最前面，且对 / 做前缀匹配，覆盖所有子目录。
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------- 2. 压缩 ----------
    # latest.js 584KB → gzip 后约 60KB，手机流量友好。
    # 注意：下面 data/ 的 no-cache 会让浏览器每次都重新校验，
    # 配合 gzip 后实际传输量很小（304 命中时只有响应头）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 3. 数据契约：每次校验，不缓存 ----------
    # data/latest.js 与 latest.json 每个交易日都会变，
    # 一旦被浏览器缓存，用户看到的还是昨天的选股。
    # no-cache 不是「不缓存」，是「每次都要回源校验」——
    # 文件没变时 nginx 返回 304，开销很小。
    location /data/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # ETag / Last-Modified 交给 nginx 自动生成，用于 304 协商
    }

    # ---------- 4. 页面与静态资源 ----------
    # HTML 也走 no-cache：改了页面（比如改文案、改链接）要能立刻看到。
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # css/js 变动频率低，给一小时缓存，减少重复下载。
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # 图片字体等长缓存
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 关掉目录列表（实测 /data/ 返回 403 是好事，保持）
    autoindex off;
}
